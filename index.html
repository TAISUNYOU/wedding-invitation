    <script>
      /* ===== 1. 공통 유틸: 날짜·시간 변환, HTML 이스케이프 ===== */

      function parseDate(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
      const MONTH_EN = [
        "JANUARY",
        "FEBRUARY",
        "MARCH",
        "APRIL",
        "MAY",
        "JUNE",
        "JULY",
        "AUGUST",
        "SEPTEMBER",
        "OCTOBER",
        "NOVEMBER",
        "DECEMBER",
      ];
      function timeLabel(t) {
        if (!t) return "";
        let [h, m] = t.split(":").map(Number);
        const ap = h < 12 ? "오전" : "오후";
        let hh = h % 12;
        if (hh === 0) hh = 12;
        return ap + " " + hh + "시" + (m ? " " + m + "분" : "");
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      /* ===== 2. 청첩장 템플릿 목록 (레몬 테마 단일) ===== */
      function defaultTemplates() {
        return [

      }

      /* ===== 3. 샘플 계정 데이터 — 실제 청첩장 내용은 여기서 수정 ===== */
      function defaultUsers() {
        return [

            data: {

              brideEn: "온세상" /* 영어 자리에 한글 풀네임 넣기 */,
              groomFather: "유인근",
              groomFatherDec: false,

              groomRelation: "아들",
              brideFather: "박병일",
              brideFatherDec: false,
              brideMother: "성서경",
              brideMotherDec: false,
              brideRelation: "딸",
              date: "2027-02-21",
              time: "14:00",
              venueName: "노블발렌티 대치",
              venueAddr: "서울특별시 강남구 영동대로 325",
              floorHall: "",
              showMap: true,

              showCalendar: true,

              coverIntro: "멋진 문구 넣기",
              gallery: [
                "pictures/img2.jpg",
                "pictures/img3.jpg",
                "pictures/img4.jpg",
                "pictures/img5.jpg",
                "pictures/img6.jpg",
                "pictures/img7.jpg",
                "pictures/img8.jpg",
              ],
              featuredGallery: [
                {
                  s: 1,

                {

                },
                {
                  s: 1,
                  x: 0,
                  y: 0,
                  src: "pictures/img11.jpg",
                  frameOrientation: "landscape",
                },
              ],
              accounts: {
                ac1: {
                  bank: "국민",
                  holder: "김도윤",
                  number: "123456-04-123456",
                },
                ac2: {
                  bank: "우리",
                  holder: "박서아",
                  number: "110-123-456789",
                },
              },
              acctOrder: [
                { key: "ac1", label: "신랑" },
                { key: "ac2", label: "신부" },
              ],
              notice:
                "신부 대기실은 1층 로비에 마련되어 있습니다.\n예식장 건물 지하 주차 2시간 무료입니다.",
              greeting:
                "두 사람이 사랑으로 만나\n진실과 이해로써 하나가 되려 합니다.\n\n저희의 작은 시작을\n귀한 걸음으로 축복해 주시면\n더없는 기쁨으로 간직하겠습니다.",
              sections: [
                { id: "cover", show: true },
                { id: "invitation", show: true },
                { id: "couple", show: true },
                { id: "gallery", show: true },

                { id: "notice", show: true },

                { id: "share", show: true },
              ],
              music: {
                enabled: true,
                kind: "preset",
                presetIdx: 0,
                url: "",
                loop: true,
              },
              shareChannels: { kakao: true, sms: true, insta: true },
              sectionLabels: {},
              coverCrop: { s: 1, x: 0, y: 0, src: "pictures/img1.jpg" },
              coverGrainEnabled: true,
              _secV2: 1,
              _secV3: 1,
              _secV4: 1,

              _secV7: 1,
            },
          },
        ];
      }

      /* ===== 4. 초대장 섹션 정의 (순서·표시 여부) ===== */
      let DB,
        session,
        prevWidth = 390,
        editId = null,
        adminTab = "users";
      const SECTION_DEFS = [
        { id: "cover", label: "표지 문구" },
        { id: "invitation", label: "인사말" },
        { id: "couple", label: "신랑 · 신부" },
        { id: "gallery", label: "갤러리" },
        { id: "where", label: "예식 장소" },
        { id: "when", label: "예식 일시" },
        { id: "notice", label: "안내 사항" },
        { id: "accounts", label: "마음 전하실 곳" },
        { id: "share", label: "공유" },
      ];
      function defaultDefaults() {
        return {
          greeting:
            "두 사람이 사랑으로 만나\n진실과 이해로써 하나가 되려 합니다.\n\n저희의 작은 시작을\n귀한 걸음으로 축복해 주시면\n더없는 기쁨으로 간직하겠습니다.",
          notice:
            "신부 대기실은 1층 로비에 마련되어 있습니다.\n예식장 건물 지하 주차 2시간 무료입니다.",
          musicPresets: [
            { name: "잔잔한 피아노", url: "" },
            { name: "서정적인 현악", url: "" },
            { name: "경쾌한 어쿠스틱", url: "" },
          ],
        };
      }
      function defaultSectionsList() {
        return SECTION_DEFS.map((x) => ({ id: x.id, show: true }));
      }
      /* ===== 5. DB 초기화·빈 청첩장 생성 헬퍼 ===== */
      function resetDB() {
        DB = {
          users: defaultUsers(),
          templates: defaultTemplates(),
          stats: {},
          defaults: defaultDefaults(),
        };
        session = null;
      }
      resetDB();

      /* ===== 6. UI 헬퍼: 앱 컨테이너·토스트 알림·해시 이동 ===== */
      const app = () => document.getElementById("app");
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove("show"), 2100);
      }
    </script>
    <!-- ===== 초대장 렌더러 (디자인·테마 코드) — assets/invitation-renderer.js ===== -->
    <script src="assets/invitation-renderer.js"></script>
    <script>
      /* ===== 1. 공유 기능: 링크 복사·네이티브 공유 ===== */
      function userSlugForData(d) {
        var u = DB.users.find(function (x) {
          return x.data === d;
        });
        if (u && u.slug) return u.slug;

        try {
          if ((location.hash || "").indexOf("#/i/") === 0) {
            var s = decodeURIComponent(location.hash.slice(4)).trim();
            if (s) return s;
          }
        } catch (e) {}
        return "";
      }

      function shareURL(slug) {
        return location.href.split("#")[0] + "#/i/" + (slug || "");
      }

      function ytsShare(slug) {
        var url = shareURL(slug);
        if (navigator.share) {
          trackShare(slug, "link");
          navigator
            .share({ title: "모바일 청첩장", url: url })
            .catch(function () {});
          return;
        }
        shareLink(slug);
      }
      function shareLink(slug) {
        trackShare(slug, "link");
        navigator.clipboard &&
          navigator.clipboard.writeText(shareURL(slug)).catch(function () {});
        toast("청첩장 링크를 복사했습니다");
      }

      /* ===== 2. 섹션 목록 정규화: 손상 방어·누락 보충·순서 보정 ===== */
      function getSections(d) {
        if (!d) return defaultSectionsList();
        if (!d.sections || !d.sections.length || !Array.isArray(d.sections)) {
          d.sections = defaultSectionsList();
          return d.sections;
        }

        d.sections = d.sections.filter(function (x) {
          return x && typeof x === "object" && x.id;
        });
        if (!d.sections.length) {
          d.sections = defaultSectionsList();
          return d.sections;
        }

        d.sections.forEach(function (x) {
          if (x.id === "invitation" || x.id === "couple") x.show = true;
        });
        const ids = d.sections.map((x) => x.id);
        SECTION_DEFS.forEach(function (def) {
          if (ids.indexOf(def.id) >= 0) return;

          var defOrder = SECTION_DEFS.findIndex(function (s) {
            return s.id === def.id;
          });
          var at = d.sections.length;
          for (var k = 0; k < d.sections.length; k++) {
            var ko = SECTION_DEFS.findIndex(function (s) {
              return s.id === d.sections[k].id;
            });
            if (ko > defOrder) {
              at = k;
              break;
            }
          }
          d.sections.splice(at, 0, { id: def.id, show: true });
        });

        if (!d._secV3) {
          ["when", "notice"].forEach(function (id) {
            var i = d.sections.findIndex((x) => x.id === id);
            if (i >= 0) {
              var it = d.sections.splice(i, 1)[0];
              var wi = d.sections.findIndex((x) => x.id === "where");
              var off = id === "when" ? 1 : 2;
              d.sections.splice(Math.min(wi + off, d.sections.length), 0, it);
            }
          });
          d._secV2 = 1;
          d._secV3 = 1;
        }
        if (!d._secV4) {
          var _ci = d.sections.findIndex((x) => x.id === "cover");
          if (_ci > 0) {
            var _c = d.sections.splice(_ci, 1)[0];
            d.sections.unshift(_c);
          }
          if (d.coverIntro == null)
            d.coverIntro =
              "Every love story is beautiful, but ours is just beginning. Join us as we promise each other a lifetime of love, laughter, and endless memories.";
          d._secV4 = 1;
        }

        if (!d._secV7) {
          var _bundle = ["accounts", "share"],
            _saved = {};
          _bundle.forEach(function (id) {
            var i = d.sections.findIndex(function (x) {
              return x.id === id;
            });
            if (i >= 0) _saved[id] = d.sections.splice(i, 1)[0];
          });
          _bundle.forEach(function (id) {
            if (_saved[id]) d.sections.push(_saved[id]);
          });
          d._secV7 = 1;
        }

        var _shi = d.sections.findIndex(function (x) {
          return x && x.id === "share";
        });
        if (_shi >= 0 && _shi !== d.sections.length - 1) {
          var _sh = d.sections.splice(_shi, 1)[0];
          d.sections.push(_sh);
        }
        return d.sections;
      }
      const DEFAULT_SEC_LABELS = {
        invitation: "INVITATION",
        couple: "THE COUPLE",
        gallery: "GALLERY",
        when: "WHEN",
        where: "WHERE",
        accounts: "마음 전하실 곳",
        notice: "안내 사항",
        share: "SHARE",
      };

      function getSecLabel(d, id) {
        var sl = (d && d.sectionLabels) || {};
        return sl[id] || DEFAULT_SEC_LABELS[id] || id;
      }

      /* ===== 3. 이미지 라이트박스·갤러리 캐러셀 ===== */

      var _gcIdx = 0,
        _gcImgs = [];
      function openGalleryCarousel(idx, cellEl) {
        closeLightbox();
        var imgs = [],
          noZoom = false;

        try {
          var grid =
            cellEl && cellEl.closest ? cellEl.closest(".luce-ggrid") : null;
          if (grid && grid.getAttribute("data-gal")) {
            imgs =
              JSON.parse(decodeURIComponent(grid.getAttribute("data-gal"))) ||
              [];
            noZoom = grid.getAttribute("data-nozoom") === "1";
          }
        } catch (e) {
          imgs = [];
        }
        if (!imgs.length) {
          document.querySelectorAll(".inv-gallery img").forEach(function (im) {
            imgs.push(im.src);
          });
        }
        if (!imgs.length) return;
        _gcImgs = imgs;
        _gcIdx = Math.max(0, Math.min(idx || 0, imgs.length - 1));
        var html =
          '<div class="lightbox carousel' +
          (noZoom ? "" : " zoomable") +
          '" id="lightbox" oncontextmenu="return false">' +
          '<button type="button" class="lightbox-close" onclick="closeLightbox()">&times;</button>' +
          '<button type="button" class="lb-nav prev" onclick="gcPrev()" aria-label="이전"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
          '<div class="lb-stage" id="lb-stage" onclick="closeLightbox()"><img class="lightbox-img" id="lb-img" src="" oncontextmenu="return false" draggable="false" onclick="event.stopPropagation()"></div>' +
          '<button type="button" class="lb-nav next" onclick="gcNext()" aria-label="다음"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
          '<div class="lb-counter" id="lb-counter"></div>' +
          "</div>";
        document.body.insertAdjacentHTML("beforeend", html);
        gcUpdate();
        var stage = document.getElementById("lb-stage");
        if (stage) {
          var sX = 0,
            cX = 0,
            dr = false;
          stage.addEventListener(
            "touchstart",
            function (e) {
              if (e.touches.length > 1) {
                dr = false;
                return;
              }
              if (!e.touches[0]) return;
              sX = e.touches[0].clientX;
              cX = sX;
              dr = true;
            },
            { passive: true },
          );
          stage.addEventListener(
            "touchmove",
            function (e) {
              if (e.touches.length > 1) {
                dr = false;
                return;
              }
              if (!dr || !e.touches[0]) return;
              cX = e.touches[0].clientX;
            },
            { passive: true },
          );
          stage.addEventListener("touchend", function () {
            if (!dr) return;
            dr = false;
            var dx = cX - sX;
            if (Math.abs(dx) > 40) {
              if (dx < 0) gcNext();
              else gcPrev();
            }
          });
        }
        if (!window._gcKeyBound) {
          window._gcKeyBound = true;
          document.addEventListener("keydown", function (e) {
            if (!document.getElementById("lightbox")) return;
            if (e.key === "ArrowRight") gcNext();
            else if (e.key === "ArrowLeft") gcPrev();
            else if (e.key === "Escape") closeLightbox();
          });
        }
      }
      function gcPrev() {
        if (!_gcImgs.length) return;
        _gcIdx = (_gcIdx - 1 + _gcImgs.length) % _gcImgs.length;
        gcUpdate();
      }
      function gcNext() {
        if (!_gcImgs.length) return;
        _gcIdx = (_gcIdx + 1) % _gcImgs.length;
        gcUpdate();
      }
      function gcUpdate() {
        var img = document.getElementById("lb-img");
        var c = document.getElementById("lb-counter");
        if (img) {
          var _o = _gcImgs[_gcIdx];
          img.onerror = function () {
            img.onerror = null;
            img.src = _o;
          };
          img.src = _o;
        }
        if (c) c.textContent = _gcIdx + 1 + " / " + _gcImgs.length;
      }
      function closeLightbox() {
        var l = document.getElementById("lightbox");
        if (l) l.remove();
      }

      /* ===== 4. 배경음악 플레이어: 자동재생·탭 전환 시 정지 ===== */
      function musicPlayerHTML(d) {
        if (!d || !d.music || !d.music.enabled) return "";
        var src = "";
        if (d.music.kind === "preset" && d.music.presetIdx >= 0) {
          var pres = (DB.defaults && DB.defaults.musicPresets) || [];
          if (pres[d.music.presetIdx]) src = pres[d.music.presetIdx].url || "";
        } else if (d.music.kind === "url" || d.music.kind === "upload") {
          src = d.music.url || "";
        }
        if (!src) return "";
        var loopAttr = d.music.loop !== false ? "loop" : "";
        return (
          '<audio id="inv-audio" src="' +
          esc(src) +
          '" ' +
          loopAttr +
          ' preload="auto"></audio>' +
          '<button class="inv-music" id="inv-music-btn" onclick="toggleMusic()" title="음악 재생/일시정지">' +
          '<svg id="music-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
          '<svg id="music-icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' +
          "</button>"
        );
      }
      function toggleMusic() {
        var a = document.getElementById("inv-audio");
        if (!a) return;
        var pi = document.getElementById("music-icon-play"),
          pa = document.getElementById("music-icon-pause");
        if (a.paused) {
          a.play()
            .then(function () {
              if (pi) pi.style.display = "none";
              if (pa) pa.style.display = "block";
            })
            .catch(function () {
              toast("재생을 시작할 수 없어요. 화면을 한 번 터치해 주세요.");
            });
        } else {
          a.pause();
          if (pi) pi.style.display = "block";
          if (pa) pa.style.display = "none";
        }
      }

      function _musicSyncIcon() {
        var a = document.getElementById("inv-audio");
        var pi = document.getElementById("music-icon-play"),
          pa = document.getElementById("music-icon-pause");
        if (!a) return;
        var playing = !a.paused;
        if (pi) pi.style.display = playing ? "none" : "block";
        if (pa) pa.style.display = playing ? "block" : "none";
      }
      (function () {
        var tried = false;
        function tryAuto() {
          var a = document.getElementById("inv-audio");
          if (!a || !a.paused || a._userPaused) return !!a && !a.paused;
          return a
            .play()
            .then(function () {
              _musicSyncIcon();
              return true;
            })
            .catch(function () {
              return false;
            });
        }
        function onGesture() {
          Promise.resolve(tryAuto()).then(function (okv) {
            if (okv) {
              ["click", "touchstart", "scroll", "keydown"].forEach(
                function (ev) {
                  document.removeEventListener(ev, onGesture, true);
                },
              );
            }
          });
        }
        new MutationObserver(function () {
          var a = document.getElementById("inv-audio");
          if (a && !a._autoInit) {
            a._autoInit = true;
            tried = false;
            window._ytsInvAudio = a;

            var origToggle = window.toggleMusic;
            window.toggleMusic = function () {
              var el = document.getElementById("inv-audio");
              if (el && !el.paused) {
                el._userPaused = true;
              } else if (el) {
                el._userPaused = false;
              }
              origToggle();
            };
            Promise.resolve(tryAuto()).then(function (okv) {
              if (!okv) {
                ["click", "touchstart", "scroll", "keydown"].forEach(
                  function (ev) {
                    document.addEventListener(ev, onGesture, true);
                  },
                );
              }
            });
          }
        }).observe(document.body, { childList: true, subtree: true });
      })();

      (function () {
        function invAudio() {
          return (
            document.getElementById("inv-audio") || window._ytsInvAudio || null
          );
        }
        function pauseInv(remember) {
          var a = invAudio();
          if (a && !a.paused) {
            if (remember) a._pausedByHide = true;
            try {
              a.pause();
            } catch (e) {}
            if (typeof _musicSyncIcon === "function") _musicSyncIcon();
          }
        }
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            pauseInv(true);
          } else {
            var a = invAudio();
            if (a && a._pausedByHide && !a._userPaused) {
              a._pausedByHide = false;
              a.play()
                .then(function () {
                  if (typeof _musicSyncIcon === "function") _musicSyncIcon();
                })
                .catch(function () {});
            }
          }
        });
        window.addEventListener("pagehide", pauseInv.bind(null, false));
        window.addEventListener("hashchange", function () {
          if ((location.hash || "").indexOf("#/i/") !== 0) {
            pauseInv(false);
          }
        });
      })();

      /* ===== 5. 조회·공유 통계 (localStorage 기반) ===== */
      function trackView(slug) {
        if (!slug || slug === "_preview") return;
        DB.stats = DB.stats || {};
        var s = (DB.stats[slug] = DB.stats[slug] || {
          views: 0,
          uniques: 0,
          shares: { kakao: 0, link: 0, sms: 0, insta: 0 },
          lastView: null,
        });
        s.views++;
        try {
          var key = "yts_seen_" + slug;
          if (!localStorage.getItem(key)) {
            s.uniques++;
            localStorage.setItem(key, "1");
          }
        } catch (e) {}
        s.lastView = Date.now();
      }
      function trackShare(slug, channel) {
        if (!slug) return;
        DB.stats = DB.stats || {};
        var s = (DB.stats[slug] = DB.stats[slug] || {
          views: 0,
          uniques: 0,
          shares: { kakao: 0, link: 0, sms: 0, insta: 0 },
          lastView: null,
        });
        s.shares = s.shares || { kakao: 0, link: 0, sms: 0, insta: 0 };
        s.shares[channel] = (s.shares[channel] || 0) + 1;
      }

      /* ===== 6. 발행 뷰 렌더링·라우터 ===== */
      function viewPublished(slug) {
        const u = DB.users.find((x) => x.slug === slug && x.role !== "admin");
        trackView(slug);
        if (!u || !u.data) return "";
        return (
          '<div class="pub-wrap"><div class="pub-paper">' +
          renderInvitation(u.data) +
          "</div></div>" +
          musicPlayerHTML(u.data)
        );
      }
      function initKakaoMap() {
        var el = document.getElementById("daumRoughmapContainer1786935611762");
        // 문서 파싱 중 첫 렌더는 컨테이너가 곧 교체되므로 스킵 (중복 렌더 방지)
        if (!el || document.readyState === "loading") return;
        if (
          !window.daum ||
          !window.daum.roughmap ||
          !window.daum.roughmap.Lander
        ) {
          var n = parseInt(el.getAttribute("data-retries") || "0", 10) + 1;
          el.setAttribute("data-retries", String(n));
          if (n <= 80) setTimeout(initKakaoMap, 120);
          else el.setAttribute("data-rendered", "1");
          return;
        }
        el.setAttribute("data-rendered", "1");
        var wrap = el.parentElement;
        var width = wrap && wrap.clientWidth > 0 ? wrap.clientWidth : 640;
        new window.daum.roughmap.Lander({
          timestamp: "1786935611762",
          key: "t4vfkrt5ttj",
          mapWidth: String(width),
          mapHeight: String(Math.round((width * 360) / 640)),
        }).render();
      }
      function render() {
        app().innerHTML = viewPublished("sample01");
        initKakaoMap();
        if (window._preserveScrollY == null) window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", render);
      window.addEventListener("DOMContentLoaded", render);
      render();
    </script>
  </body>
</html>
