function syncPreviewToEditor(ds){if(window._softRendering)return;var DS_TO_PV={cover:'top',greeting:'invitation',basic:'couple',gallery:'gallery',when:'when',where:'where',accounts:'accounts',rsvp:'rsvp',notice:'notice',share:'share',thanks:'top',music:'top'};var pvSec=DS_TO_PV[ds];if(!pvSec)return;var pvScroll=document.getElementById('pv-scroll');if(!pvScroll)return;if(pvSec==='top'){pvScroll.scrollTo({top:0,behavior:'smooth'});return;}var target=pvScroll.querySelector('[data-pv-sec="'+pvSec+'"]');if(target){var pvH=pvScroll.clientHeight||500;var tH=target.offsetHeight||0;var rel=target.offsetTop-Math.max(40,(pvH-tH)/2);if(rel<0)rel=0;pvScroll.scrollTo({top:rel,behavior:'smooth'});}}
var _scrollSyncTimer=null,_lastSyncedSec=null;
function setSyncLock(dir){var dur=(dir==='user-jump')?900:600;window._syncLock={dir:dir,ts:Date.now(),dur:dur};}
function checkSyncLock(dir){if(!window._syncLock)return false;var dur=window._syncLock.dur||600;if(Date.now()-window._syncLock.ts>dur){window._syncLock=null;return false;}return window._syncLock.dir!==dir;}
function setupScrollSync(){
  if(window._softRendering)return;
  if(window._scrollObs){try{window._scrollObs.disconnect();}catch(e){}}
  if(window._pvScrollObs){try{window._pvScrollObs.disconnect();}catch(e){}}
  if(typeof IntersectionObserver==='undefined')return;
  /* Editor → Preview */
  var cards=document.querySelectorAll('.editor .ed-section[data-sec]');
  if(cards.length){
    var observed={};
    var initTime=Date.now();
    var obs=new IntersectionObserver(function(entries){
      if(window._softRendering)return;
      if(Date.now()-initTime<400)return;
      if(checkSyncLock('editor-to-preview'))return;
      entries.forEach(function(e){observed[e.target.dataset.sec]={ratio:e.intersectionRatio,top:e.target.getBoundingClientRect().top};});
      var trigger=window.innerHeight*0.32;
      var best=null,bestDist=Infinity;
      Object.keys(observed).forEach(function(k){var o=observed[k];if(o.ratio<=0)return;var dist=Math.abs(o.top-trigger);if(dist<bestDist){bestDist=dist;best=k;}});
      if(best&&best!==_lastSyncedSec){
        clearTimeout(_scrollSyncTimer);
        _scrollSyncTimer=setTimeout(function(){_lastSyncedSec=best;
          var wantPost=(best==='thanks');
          if((wantPost&&window._pvMode!=='post')||(!wantPost&&window._pvMode==='post')){setPvMode(wantPost?'post':'live');}
          setSyncLock('editor-to-preview');syncPreviewToEditor(best);
        },60);
      }
    },{threshold:[0,0.1,0.25,0.5,0.75,1],rootMargin:'-25% 0px -55% 0px'});
    cards.forEach(function(c){obs.observe(c);});
    window._scrollObs=obs;
  }
  /* Preview → Editor via scroll event */
  var pvScroll=document.getElementById('pv-scroll');
  if(pvScroll){
    var PV_TO_DS={invitation:'greeting',couple:'basic',gallery:'gallery',when:'when',where:'where',accounts:'accounts',rsvp:'rsvp',notice:'notice',share:'share'};
    var pvLast=null,pvScrollTimer=null,pvInitTime=Date.now();
    function onPvScroll(){
      if(window._softRendering)return;
      if(Date.now()-pvInitTime<500)return;
      if(checkSyncLock('preview-to-editor'))return;
      clearTimeout(pvScrollTimer);
      pvScrollTimer=setTimeout(function(){
        var triggerY=pvScroll.clientHeight*0.32;
        var secs=pvScroll.querySelectorAll('[data-pv-sec]');
        var best=null,bestDist=Infinity;
        secs.forEach(function(el){
          var top=el.offsetTop-pvScroll.scrollTop;
          var bot=top+el.offsetHeight;
          if(bot<0||top>pvScroll.clientHeight)return;
          var dist=Math.abs(top-triggerY);
          if(dist<bestDist){bestDist=dist;best=el.dataset.pvSec;}
        });
        if(best&&best!==pvLast){
          pvLast=best;
          var ds=PV_TO_DS[best];if(!ds)return;
          var el=document.querySelector('.editor .ed-section[data-sec="'+ds+'"]');
          if(el){
            setSyncLock('preview-to-editor');
            var top=el.getBoundingClientRect().top+window.scrollY-window.innerHeight*0.32;
            window.scrollTo({top:top,behavior:'smooth'});
          }
        }
      },80);
    }
    /* attach scroll listener; use capture true to ensure firing */
    if(window._pvScrollListener){pvScroll.removeEventListener('scroll',window._pvScrollListener);}
    window._pvScrollListener=onPvScroll;
    pvScroll.addEventListener('scroll',onPvScroll,{passive:true});
  }
}
function toggleSecById(id){var u=editTarget();u.data.sections=u.data.sections||defaultSectionsList();var arr=u.data.sections;var idx=arr.findIndex(function(z){return z.id===id;});if(idx<0)return;var newShow=!(arr[idx].show!==false);arr[idx].show=newShow;arr[idx].userOff=!newShow;softRender();}

function softRender(){
  var sp=window.scrollY||document.documentElement.scrollTop||0;
  var ae=document.activeElement;
  var aeId=ae&&ae.id?ae.id:null;
  var aeSel=(ae&&typeof ae.selectionStart==='number')?ae.selectionStart:null;
  /* Lock against IO during entire render lifecycle */
  window._softRendering=true;
  window._preserveScrollY=sp;
  /* Force scroll-behavior:auto on the root so any pending smooth scroll cannot continue across render */
  var rootEl=document.documentElement;
  var prevBehavior=rootEl.style.scrollBehavior;
  rootEl.style.scrollBehavior='auto';
  render();
  /* ONE synchronous restoration — before any paint cycle */
  window.scrollTo(0,sp);
  /* Restore focus (preventScroll true so re-focus doesn't trigger scrollIntoView) */
  if(aeId){var re=document.getElementById(aeId);if(re){try{re.focus({preventScroll:true});if(aeSel!=null&&re.setSelectionRange)re.setSelectionRange(aeSel,aeSel);}catch(e){}}}
  /* After paint: restore scroll-behavior, clear locks, rebind IO. NO additional scrollTo. */
  requestAnimationFrame(function(){
    rootEl.style.scrollBehavior=prevBehavior;
    window._preserveScrollY=null;
    window._softRendering=false;
    if(typeof setupScrollSync==='function')setupScrollSync();
  });
}

function edCheck(k,v){if(v===undefined){delete editTarget().data[k];}else{editTarget().data[k]=v;}refreshPreview();updateProgress();}
function toggleDec(btn,key){
  var cur=btn.classList.contains('on');

function slugSection(u){
  const isAdmin=session.role==='admin';
  const _g=u.data&&u.data.date?gate(u.data.date):null;
  const deployed=_g&&(_g.state==='open'||_g.state==='ended');
  const locked=!isAdmin&&(u.slugLocked||deployed);
  const input='<div class="slug-row"><span class="pfx">.../#/i/</span><input id="f-slug" value="'+esc(u.slug)+'" placeholder="원하는 주소" '+(locked?'disabled':'oninput="edSlug(this.value)"')+'></div>';
  let note;
  if(isAdmin){
    note='<div class="slug-note">관리자는 주소를 자유롭게 수정할 수 있습니다. '+(u.slugLocked?'<button class="btn-ghost btn-sm" onclick="adminSlugLock(false)">사용자 잠금 해제</button>':'<button class="btn-ghost btn-sm" onclick="adminSlugLock(true)">사용자 주소 잠금</button>')+'</div>';
  }else if(locked){
    note='<div class="slug-note lock">'+(deployed?'✓ 배포된 청첩장은 주소를 변경할 수 없습니다.':'✓ 확정된 공개 주소입니다.')+'</div>';
  }else{
    const empty=!u.slug;
    const dup=u.slug && DB.users.some(x=>x!==u && x.slug===u.slug);
    const cls=empty?'sub':(dup?'err':'ok');
    const txt=empty?'주소를 입력해 주세요':(dup?'이미 사용 중인 주소입니다 · 다른 주소를 입력해 주세요':'사용 가능한 주소입니다');
    note='<div id="slug-validate" class="slug-note '+cls+'">'+txt+'</div>'
      +'<div class="slug-note sub" style="margin-top:6px">확정 전까지 자유롭게 수정할 수 있어요. 확정 후에는 변경이 불가합니다.</div>'
      +'<button class="btn btn-line btn-sm" style="margin-top:10px" onclick="confirmSlug()">이 주소로 확정</button>';
  }

function openCoverEdit(){

  var ex=document.getElementById("cover-edit");if(ex)ex.outerHTML="";
  document.body.insertAdjacentHTML("beforeend",html);
  document.getElementById("cover-edit").classList.add("open");

function resetCoverEdit(){
  _cvPos={x:0,y:0,dragging:false,startX:0,startY:0,scale:1};
  var z=document.getElementById('cv-zoom');if(z)z.value=100;
  var zv=document.getElementById('cv-zoom-val');if(zv)zv.textContent='100%';
  /* restore underlying image to the original upload (not the last edited save) */

  d.cover=orig;

function closeCoverEdit(){var m=document.getElementById("cover-edit");if(m)m.outerHTML="";}
var _cvPos={x:0,y:0,dragging:false,startX:0,startY:0,scale:1};
function bindCoverDrag(){var img=document.getElementById("cv-img");if(!img)return;_cvPos={x:0,y:0,dragging:false,startX:0,startY:0,scale:1};img.addEventListener("mousedown",function(e){_cvPos.dragging=true;_cvPos.startX=e.clientX-_cvPos.x;_cvPos.startY=e.clientY-_cvPos.y;e.preventDefault();});document.addEventListener('mousemove',function(e){if(!_cvPos.dragging)return;_cvPos.x=e.clientX-_cvPos.startX;_cvPos.y=e.clientY-_cvPos.startY;updateCoverEdit();});document.addEventListener("mouseup",function(){_cvPos.dragging=false;});}
function updateCoverEdit(){var img=document.getElementById('cv-img');var z=document.getElementById('cv-zoom');var canvas=document.getElementById('cv-canvas');if(!img||!z||!canvas)return;_cvPos.scale=parseInt(z.value,10)/100;var zv=document.getElementById('cv-zoom-val');if(zv)zv.textContent=z.value+'%';var box=canvas.getBoundingClientRect();var natW=img.naturalWidth||box.width,natH=img.naturalHeight||box.height;var baseScale=Math.max(box.width/natW,box.height/natH);var rW=natW*baseScale*_cvPos.scale;var rH=natH*baseScale*_cvPos.scale;var maxX=Math.max(0,(rW-box.width)/2);var maxY=Math.max(0,(rH-box.height)/2);if(_cvPos.x>maxX)_cvPos.x=maxX;if(_cvPos.x<-maxX)_cvPos.x=-maxX;if(_cvPos.y>maxY)_cvPos.y=maxY;if(_cvPos.y<-maxY)_cvPos.y=-maxY;img.style.transform='translate('+_cvPos.x+'px,'+_cvPos.y+'px) scale('+_cvPos.scale+')';}
function saveCoverEdit(){
  var img=document.getElementById('cv-img');var canvas=document.getElementById('cv-canvas');
  if(!img||!canvas){closeCoverEdit();return;}
  var box=canvas.getBoundingClientRect();
  var OUT_W=600,OUT_H=800;
  var c=document.createElement('canvas');c.width=OUT_W;c.height=OUT_H;
  var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,OUT_W,OUT_H);
  var img2=new Image();
  img2.onload=function(){
    var natW=img2.naturalWidth,natH=img2.naturalHeight;
    var baseScale=Math.max(box.width/natW,box.height/natH);
    var scl=_cvPos.scale||1;
    var rW=natW*baseScale*scl,rH=natH*baseScale*scl;
    var tx=(box.width-rW)/2+(_cvPos.x||0);
    var ty=(box.height-rH)/2+(_cvPos.y||0);
    var natPerCanvas=natW/rW;
    var sx=(0-tx)*natPerCanvas;
    var sy=(0-ty)*natPerCanvas;
    var sw=box.width*natPerCanvas;
    var sh=box.height*natPerCanvas;
    var dx=0,dy=0,dw=OUT_W,dh=OUT_H;
    if(sx<0){var trimL=-sx*(OUT_W/sw);dx+=trimL;dw-=trimL;sw+=sx;sx=0;}
    if(sy<0){var trimT=-sy*(OUT_H/sh);dy+=trimT;dh-=trimT;sh+=sy;sy=0;}
    if(sx+sw>natW){sw=natW-sx;}
    if(sy+sh>natH){sh=natH-sy;}
    if(sw<=0||sh<=0){closeCoverEdit();toast('편집 영역이 비어있어요');return;}
    ctx.drawImage(img2,sx,sy,sw,sh,dx,dy,dw,dh);
    var d=editTarget().data;
    d.cover=c.toDataURL('image/jpeg',0.92);
    closeCoverEdit();
    softRender();
    toast('표지가 편집되었습니다');
  };
  img2.onerror=function(){closeCoverEdit();toast('편집 실패 — 다시 시도해 주세요');};
  img2.src=img.src;
}

function onCoverPick(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{var d=editTarget().data;d.cover=e.target.result;d._coverOriginal=e.target.result;var u=editTarget();u.data.sections=u.data.sections||defaultSectionsList();var sx=u.data.sections.find(z=>z.id==='gallery');if(sx&&sx.show===false&&!sx.userOff)sx.show=true;softRender();toast('표지 사진을 추가했습니다');};r.readAsDataURL(f);}
function onGalleryPick(input){const all=[...input.files];if(!all.length)return;const d=editTarget().data;d.gallery=d.gallery||[];const room=20-d.gallery.length;if(room<=0){toast('갤러리는 최대 20장까지 등록할 수 있습니다');input.value='';return;}const files=all.slice(0,room);let n=files.length;files.forEach(f=>{const r=new FileReader();r.onload=e=>{d.gallery.push(e.target.result);if(--n===0){var u=editTarget();u.data.sections=u.data.sections||defaultSectionsList();var sx=u.data.sections.find(function(z){return z.id==='gallery';});if(sx&&sx.show===false&&!sx.userOff)sx.show=true;softRender();toast(all.length>room?('최대 20장 제한으로 '+room+'장만 추가했습니다'):('갤러리에 '+files.length+'장 추가했습니다'));}};r.readAsDataURL(f);});}

function gateWithOverrides(d){
  if(!d||!d.date) return gate(null);
  var w=parseDate(d.date);w.setHours(0,0,0,0);
  var openDefault=new Date(w.getTime()-50*DAY);
  var closeDefault=new Date(w.getTime()+7*DAY);
  var open=d.publishStart?parseDate(d.publishStart):openDefault;
  var close=d.publishEnd?parseDate(d.publishEnd):closeDefault;
  open.setHours(0,0,0,0);close.setHours(0,0,0,0);
  var t=today();
  var openStr=fmtDObj(open),closeStr=fmtDObj(close);
  if(t<open)return{state:'wait',cls:'wait',days:daysBetween(t,open),openStr:openStr,closeStr:closeStr,label:'공개 전',detail:''};
  if(t>close)return{state:'ended',cls:'ended',openStr:openStr,closeStr:closeStr,label:'공개 종료',detail:openStr+' ~ '+closeStr};
  return{state:'open',cls:'open',days:daysBetween(t,w),openStr:openStr,closeStr:closeStr,label:'공개 중',detail:openStr+' ~ '+closeStr};
}

/* ===== NEW: section system + lightbox + QR + defaults ===== */
function getSections(d){
  if(!d)return defaultSectionsList();
  if(!d.sections||!d.sections.length||!Array.isArray(d.sections)){d.sections=defaultSectionsList();return d.sections;}
  /* 손상 방어(자가치유): null·비객체·id없는 섹션 요소 제거. 과거 드래그 splice 가 잘못된 인덱스에서
     undefined 를 삽입→저장(JSON null)한 데이터가, 여기서 x.id 접근 시 TypeError 를 내
     getSections→renderInvitation 전체(편집기·하객뷰)를 크래시시키던 문제를 차단하고, 다음 저장 시 자가치유. */
  d.sections = d.sections.filter(function(x){ return x && typeof x === 'object' && x.id; });
  if(!d.sections.length){ d.sections=defaultSectionsList(); return d.sections; }
  // Migrate: ensure any new section in SECTION_DEFS but missing from d.sections is appended
  if(window.CEZ_RSVP_DISABLED) d.sections=d.sections.filter(x=>x.id!=='rsvp'); /* RSVP 비활성 시에만 제거 */
  d.sections.forEach(function(x){ if(x.id==='invitation'||x.id==='couple') x.show=true; }); /* invitation/couple만 항상 표시. where/when은 뮤트 가능 */
  const ids=d.sections.map(x=>x.id);
  SECTION_DEFS.forEach(function(def){
    if(ids.indexOf(def.id)>=0)return;
    /* 누락 섹션은 끝에 붙이지 말고 SECTION_DEFS 순서상 올바른 위치에 삽입(예: 계좌는 공유 앞) */
    var defOrder=SECTION_DEFS.findIndex(function(s){return s.id===def.id;});
    var at=d.sections.length;
    for(var k=0;k<d.sections.length;k++){ var ko=SECTION_DEFS.findIndex(function(s){return s.id===d.sections[k].id;}); if(ko>defOrder){ at=k; break; } }
    d.sections.splice(at,0,{id:def.id,show:true});
  });
  /* v4.4: Figma 순서(venue→date→information)로 일회성 정렬(이후 사용자 드래그 존중) */
  if(!d._secV3){
    ['when','notice'].forEach(function(id){ var i=d.sections.findIndex(x=>x.id===id); if(i>=0){ var it=d.sections.splice(i,1)[0]; var wi=d.sections.findIndex(x=>x.id==='where'); var off=(id==='when')?1:2; d.sections.splice(Math.min(wi+off,d.sections.length),0,it); } });
    d._secV2=1; d._secV3=1;
  }
  if(!d._secV4){
    var _ci=d.sections.findIndex(x=>x.id==='cover'); if(_ci>0){ var _c=d.sections.splice(_ci,1)[0]; d.sections.unshift(_c); }
    if(!window.CEZ_RSVP_DISABLED){ var _ri=d.sections.findIndex(x=>x.id==='rsvp'); if(_ri>=0){ var _r=d.sections.splice(_ri,1)[0]; var _si=d.sections.findIndex(x=>x.id==='share'); if(_si<0)_si=d.sections.length; d.sections.splice(_si,0,_r); } }
    if(d.coverIntro==null) d.coverIntro='Every love story is beautiful, but ours is just beginning. Join us as we promise each other a lifetime of love, laughter, and endless memories.';
    d._secV4=1;
  }
  if(!d._secV5){
    if(!window.CEZ_RSVP_DISABLED){ var _ri5=d.sections.findIndex(x=>x.id==='rsvp'); if(_ri5>=0){ var _r5=d.sections.splice(_ri5,1)[0]; var _ai5=d.sections.findIndex(x=>x.id==='accounts'); if(_ai5<0)_ai5=d.sections.length; d.sections.splice(_ai5,0,_r5); } }
    d._secV5=1;
  }
  if(!d._secV6){ var _rs6=d.sections.find(x=>x.id==='rsvp'); if(_rs6 && !_rs6.userOff && !_rs6.userOn) _rs6.show=false; d._secV6=1; }
  /* v7: 과거 append 버그로 rsvp/accounts가 공유 뒤 등 엉뚱한 위치에 저장된 경우 정규화 —
     하단 묶음을 항상 rsvp→accounts→share 순서(공유 맨 끝)로. 각 섹션의 show/userOff 상태는 보존 */
  if(!d._secV7 && !window.CEZ_RSVP_DISABLED){
    var _bundle=['rsvp','accounts','share'], _saved={};
    _bundle.forEach(function(id){ var i=d.sections.findIndex(function(x){return x.id===id;}); if(i>=0)_saved[id]=d.sections.splice(i,1)[0]; });
    _bundle.forEach(function(id){ if(_saved[id])d.sections.push(_saved[id]); });
    d._secV7=1;
  }
  /* 공유(share)는 편집기 재정렬 대상이 아니므로 '항상' 마지막으로 고정(매 렌더 idempotent).
     _secV7은 1회성이라, 이후 인덱스 버그로 share 앞으로 섹션이 끼어든 데이터를 못 고쳤음 →
     ① 편집기 섹션 리스트(share 제외 렌더)의 인덱스가 d.sections와 정렬돼 재정렬 릴리즈가 정상 동작
     ② 프리뷰에서 share 밑에 섹션이 남지 않아 그 사이 접힘선이 사라짐. share 없으면 no-op. */
  var _shi=d.sections.findIndex(function(x){return x&&x.id==='share';});
  if(_shi>=0 && _shi!==d.sections.length-1){ var _sh=d.sections.splice(_shi,1)[0]; d.sections.push(_sh); }
  return d.sections;
}

  if(id==='notice') return p.notice?sect(getSecLabel(d,'notice'),sk,'<div class="greet" style="color:'+sk.sub+'">'+esc(p.notice)+'</div>','notice'):'<div data-pv-sec="notice" style="height:1px"></div>';
  if(id==='share') return sect(getSecLabel(d,'share'),sk,shareHTML(d,sk),'share');
  return '';

/* ── RSVP 저장 신뢰성 (응답 누락 방지) ────────────────────────────────
   과거: 저장 성공 여부와 무관하게 하객에게 '감사'를 즉시 표시 → 저장이 실패해도(느린 네트워크·slug 미해석·RPC 오류)
         하객은 모르고 다시 안 보내 → 응답이 조용히 유실.
   개선: (1) 저장 성공을 '확인한 뒤에만' 완료 표시, (2) 3회 재시도, (3) 실패 시 재접속 때 자동 재전송(localStorage). */
var CEZ_RSVP_PEND='cez_pending_rsvp';
async function saveRSVPReliable(slug, payload){
  for(var attempt=0; attempt<3; attempt++){
    try{
      var inv=await SB.getInvitationBySlug(slug);
      if(inv && inv.id){ await SB.submitRSVP(inv.id, payload); return true; }
    }catch(e){ console.error('[RSVP save] 시도 '+(attempt+1)+'/3', e && e.message); }
    await new Promise(function(r){ setTimeout(r, 700*(attempt+1)); });   /* 백오프 */
  }
  return false;
}
function cezPendGet(){ try{ return JSON.parse(localStorage.getItem(CEZ_RSVP_PEND)||'[]'); }catch(e){ return []; } }
function cezPendSet(a){ try{ localStorage.setItem(CEZ_RSVP_PEND, JSON.stringify(a.slice(-20))); }catch(e){} }
function cezStashPendingRSVP(slug, payload, key){ var a=cezPendGet(); a.push({slug:slug,payload:payload,key:key,ts:Date.now()}); cezPendSet(a); }
function cezClearPending(key){ if(!key)return; cezPendSet(cezPendGet().filter(function(x){return x.key!==key;})); }
async function cezFlushPendingRSVP(){
  try{
    var a=cezPendGet(); if(!a.length) return;
    if(!(window.SB && typeof SB.submitRSVP==='function' && typeof SB.getInvitationBySlug==='function')){ setTimeout(cezFlushPendingRSVP, 5000); return; }
    var keep=[];
    for(var i=0;i<a.length;i++){ var ok=await saveRSVPReliable(a[i].slug, a[i].payload); if(!ok) keep.push(a[i]); }
    cezPendSet(keep);
  }catch(e){}
}
try{ setTimeout(cezFlushPendingRSVP, 6000); }catch(e){}   /* 접속 시 지난 실패분 자동 재전송 */

function submitRSVPv2(slug){
  /* 슬러그: 해시형(#/i/slug)·경로형(/i/slug) 모두 URL 을 신뢰 (렌더 slug 오해석으로 저장 스킵되던 문제 방지) */
  try{
    var _h=location.hash||'';
    if(_h.indexOf('#/i/')===0){ var _us=decodeURIComponent(_h.slice(4)).trim(); if(_us) slug=_us; }
    else { var _pm=(location.pathname||'').match(/^\/i\/([^\/?#]+)/); if(_pm && _pm[1]){ var _ps=decodeURIComponent(_pm[1]).trim(); if(_ps) slug=_ps; } }
  }catch(e){}
  var n=document.getElementById('rs-name');
  if(!n||!n.value.trim()){toast('성함을 입력해 주세요');return;}
  var rec={name:n.value.trim(),ts:Date.now()};
  var sd=document.querySelector('input[name=rs-side]:checked');if(sd)rec.side=sd.value;
  var c=document.getElementById('rs-count');if(c)rec.count=c.value;
  var a=document.querySelector('input[name=rs-att]:checked');if(a)rec.attend=a.value;
  var m=document.querySelector('input[name=rs-meal]:checked');if(m)rec.meal=m.value;
  var al=document.getElementById('rs-allergy');if(al)rec.allergy=al.value.trim();
  var sh=document.querySelector('input[name=rs-sh]:checked');if(sh)rec.shuttle=sh.value;
  var pk=document.querySelector('input[name=rs-pk]:checked');if(pk)rec.parking=pk.value;
  var msg=document.getElementById('rs-msg');if(msg)rec.message=msg.value.trim();

  var extras=[];
  if(rec.allergy) extras.push('알레르기: '+rec.allergy);
  if(rec.shuttle) extras.push('셔틀버스: '+rec.shuttle);
  if(rec.parking) extras.push('주차: '+rec.parking);
  var fullMsg=(rec.message||'')+(extras.length?((rec.message?'\n':'')+extras.join(' · ')):'');
  var payload={name:rec.name, side:rec.side||null, attend:rec.attend||null, count:rec.count||null, meal:rec.meal||null, message:fullMsg||null};
  var pkey=slug+'|'+rec.name+'|'+rec.ts;

  function showDone(){
    DB.rsvps=DB.rsvps||{};DB.rsvps[slug]=DB.rsvps[slug]||[];
    DB.rsvps[slug].push(rec);DB.rsvps[slug]._submitted=true;

  }

  /* 프리뷰/에디터(실제 저장 대상 아님) — 기존처럼 즉시 완료 */
  var canSave = slug && slug!=='_preview' && window.SB && typeof SB.submitRSVP==='function' && typeof SB.getInvitationBySlug==='function';
  if(!canSave){ showDone(); return; }

  /* 실제 하객 — 저장 성공을 확인한 뒤에만 완료 표시 */
  var btn=document.querySelector('.rs2-submit'); var oldTxt=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='보내는 중…'; }
  saveRSVPReliable(slug, payload).then(function(ok){
    if(ok){ cezClearPending(pkey); showDone(); }
    else {
      cezStashPendingRSVP(slug, payload, pkey);           /* 재접속 시 자동 재전송 */
      if(btn){ btn.disabled=false; btn.textContent=oldTxt||'제출하기'; }
      toast('저장이 지연되고 있어요. 잠시 후 한 번만 더 눌러 주세요 🙏');
    }
  });
}

/* 자동재생: 진입 시 바로 시도, 브라우저가 막으면 첫 터치/스크롤에서 시작 (사용자가 일시정지하면 다시 켜지 않음) */
function _musicSyncIcon(){var a=document.getElementById('inv-audio');var pi=document.getElementById('music-icon-play'),pa=document.getElementById('music-icon-pause');if(!a)return;var playing=!a.paused;if(pi)pi.style.display=playing?'none':'block';if(pa)pa.style.display=playing?'block':'none';}
(function(){
  var tried=false;
  function tryAuto(){
    var a=document.getElementById('inv-audio');
    if(!a||!a.paused||a._userPaused)return !!a&&!a.paused;
    return a.play().then(function(){_musicSyncIcon();return true;}).catch(function(){return false;});
  }
  function onGesture(){ Promise.resolve(tryAuto()).then(function(okv){ if(okv){ ['click','touchstart','scroll','keydown'].forEach(function(ev){ document.removeEventListener(ev,onGesture,true); }); } }); }
  new MutationObserver(function(){
    var a=document.getElementById('inv-audio');
    if(a&&!a._autoInit){
      a._autoInit=true; tried=false; window._cezInvAudio=a; /* 이탈 시 정지용 참조(엘리먼트가 DOM에서 제거돼도 접근) */
      /* toggleMusic의 일시정지만 사용자 의도로 기록 */
      var origToggle=window.toggleMusic;
      window.toggleMusic=function(){ var el=document.getElementById('inv-audio'); if(el&&!el.paused){ el._userPaused=true; } else if(el){ el._userPaused=false; } origToggle(); };
      Promise.resolve(tryAuto()).then(function(okv){
        if(!okv){ ['click','touchstart','scroll','keydown'].forEach(function(ev){ document.addEventListener(ev,onGesture,true); }); }
      });
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
/* 배경음악: 탭 전환·이탈·라우트 이동 시 정지 (하객이 나가도 계속 재생되던 문제) */
(function(){
  function invAudio(){ return document.getElementById('inv-audio')||window._cezInvAudio||null; }
  function pauseInv(remember){ var a=invAudio(); if(a&&!a.paused){ if(remember)a._pausedByHide=true; try{a.pause();}catch(e){} if(typeof _musicSyncIcon==='function')_musicSyncIcon(); } }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ pauseInv(true); }
    else { var a=invAudio(); if(a&&a._pausedByHide&&!a._userPaused){ a._pausedByHide=false; a.play().then(function(){ if(typeof _musicSyncIcon==='function')_musicSyncIcon(); }).catch(function(){}); } }
  });
  window.addEventListener('pagehide',pauseInv.bind(null,false));

/* Calendar save (Google Calendar + ICS) */
function downloadICS(){
  var u=editTarget&&editTarget()?editTarget():null;
  /* When called from public invitation, fallback to current rendered data via DOM context */
  var d=u?u.data:null;
  if(!d){var slug=(location.hash||'').replace('#/i/','');var x=DB.users.find(function(x){return x.slug===slug;});if(x)d=x.data;}
  if(!d||!d.date){toast('예식 정보가 없습니다');return;}
  var dt=parseDate(d.date);
  var h=parseInt((d.time||'14:00').split(':')[0],10), mn=parseInt((d.time||'14:00').split(':')[1]||0,10);
  var start=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),h,mn);
  var end=new Date(start.getTime()+120*60*1000);
  function pad2(n){return String(n).padStart(2,'0');}
  function fmt(x){return x.getUTCFullYear()+pad2(x.getUTCMonth()+1)+pad2(x.getUTCDate())+'T'+pad2(x.getUTCHours())+pad2(x.getUTCMinutes())+'00Z';}
  var title=(d.groomKo||'신랑')+' · '+(d.brideKo||'신부')+' 결혼식';
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CEZ//mocheong//KR\r\nBEGIN:VEVENT\r\nUID:'+Date.now()+'@cez\r\nDTSTAMP:'+fmt(new Date())+'\r\nDTSTART:'+fmt(start)+'\r\nDTEND:'+fmt(end)+'\r\nSUMMARY:'+title+'\r\nLOCATION:'+((d.venueName||'')+' '+(d.venueAddr||''))+'\r\nDESCRIPTION:CEZ 모바일 청첩장\r\nEND:VEVENT\r\nEND:VCALENDAR';
  var b=new Blob([ics],{type:'text/calendar'});
  var url=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=url;a.download='wedding.ics';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('iCal 파일을 저장했습니다');
}

/* 소유자/관리자가 본인 청첩장 RSVP 응답을 서버에서 불러와 DB.rsvps 에 채움(통계·명단 표시용).
   list_my_rsvps RPC 미설치 시엔 조용히 무시(기존 동작 유지). */
async function cezLoadRSVPs(slug,verbose){
  var say=function(m){ window._cezRsvpDbg=m; if(verbose&&window.toast)toast(m); };
  if(!slug){ say('슬러그 없음'); return; }
  if(!(window.SB && SB.user)){ say('로그인 필요'); return; }
  /* supabase-js rpc()는 세션 갱신 락으로 영구 대기 가능(getInvitationBySlug 참고) → 인증 토큰 직접 fetch(POST) */
  var data=null, err='';
  try{
    var tok=(SB._token&&SB._token())||null, c=(SB.cfg&&SB.cfg())||{};
    if(!tok){ err='토큰 없음(재로그인 필요)'; }
    else if(!c.url||!c.key){ err='서버설정 없음'; }
    else{
      var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
      var to=ctrl?setTimeout(function(){ctrl.abort();},8000):null;
      var resp=await fetch(c.url+'/rest/v1/rpc/list_my_rsvps',{method:'POST',headers:{'apikey':c.key,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({p_slug:slug}),signal:ctrl?ctrl.signal:undefined});
      if(to)clearTimeout(to);
      if(resp.ok){ data=await resp.json(); }
      else { err='HTTP '+resp.status+' '+((await resp.text().catch(function(){return '';}))||'').slice(0,140); }
    }
  }catch(e){ err='fetch: '+((e&&e.message)||e); }
  if(!Array.isArray(data)){
    try{ var r=await SB.client.rpc('list_my_rsvps',{p_slug:slug}); if(r&&!r.error&&Array.isArray(r.data)){ data=r.data; err=''; } else if(r&&r.error){ err=err||('rpc: '+r.error.message); } }catch(e){ err=err||('rpc: '+((e&&e.message)||e)); }
  }
  if(!Array.isArray(data)){ say('불러오기 실패: '+(err||'알수없음')); return; }
  DB.rsvps=DB.rsvps||{};
  DB.rsvps[slug]=data.map(function(x){
    return { name:x.name, side:x.side, attend:x.attend, count:x.count, meal:x.meal, message:x.message,
             ts: x.created_at ? +new Date(x.created_at) : Date.now() };
  });
  say('응답 '+data.length+'건 불러옴');
  var el=document.querySelector('[data-sub="rsvp-stats"]');
  if(el && typeof rsvpStatsSubsection==='function' && typeof editTarget==='function'){
    try{ var _wasC=el.classList.contains('collapsed'); el.outerHTML=rsvpStatsSubsection(editTarget()); var _e2=document.querySelector('[data-sub="rsvp-stats"]'); if(_e2&&_wasC)_e2.classList.add('collapsed'); }catch(e){} /* 재렌더 시 접힘 상태 보존(안 그러면 로드 후 항상 펼쳐져 안 닫힘) */
  }
}

 {category:'제작·수정',question:'템플릿(디자인)을 바꾸면 입력한 내용은 어떻게 되나요?',answer:'그대로 유지됩니다. 편집 화면의 템플릿 [변경]을 누르면 디자인 썸네일이 나오고, 선택하면 내용은 그대로 둔 채 디자인만 바뀌어요. [완료]를 누르면 닫힙니다.',sort_order:50,visible:true},
 {category:'제작·수정',question:'종이 청첩장에 넣을 QR 코드는 어떻게 받나요?',answer:'편집 화면 상단의 QR 버튼에서 언제든 고해상도 이미지(인쇄용)로 내려받으실 수 있어요. QR 코드는 청첩장 고유 주소로 만들어지기 때문에 내용을 수정하셔도 코드는 그대로 유지됩니다. 인쇄하신 후에도 안심하고 수정하세요.',sort_order:60,visible:true},
 {category:'공개·소장',question:'청첩장은 언제부터, 언제까지 공개되나요?',answer:'공개 설정에서 [바로 공개하기]를 누르면 그 순간부터 하객에게 공개돼요. 공개하려면 예식일이 입력되어 있어야 해요(공개는 예식일까지 유지되기 때문이에요). 예식일 이후에는 감사 인사 화면으로 바뀌고, 예식일로부터 3개월까지 소장 상태로 보관됩니다. 공개 설정 카드에서 공개 기간과 소장 기간을 바로 확인하실 수 있어요.',sort_order:70,visible:true},
 {category:'공개·소장',question:'공개가 끝난 뒤에는 어떻게 되나요?',answer:"하객에게는 감사 인사 화면이 보이고, 본인은 소장 기간(예식일로부터 3개월) 동안 로그인해서 언제든 추억으로 다시 열람하실 수 있습니다. 예식일로부터 6개월이 지나면 관리자 보관 상태로 전환되어 직접 열람은 어려워지지만, 데이터는 삭제되지 않으니 필요하실 때 문의해 주세요.",sort_order:80,visible:true},
 {category:'공개·소장',question:'공개가 끝난 청첩장을 다시 공개(연장)할 수 있나요?',answer:'소장 상태에서는 직접 다시 공개하실 수 없어요. 연장이 필요하시면 네이버 톡톡으로 문의해 주시면 확인 후 도와드리겠습니다.',sort_order:90,visible:true},
 {category:'공개·소장',question:'청첩장 주소(URL)를 바꾸고 싶어요.',answer:'공개 중에는 주소를 변경할 수 없어요. QR 코드와 이미 전달된 링크가 모두 이 주소를 기준으로 하기 때문이에요. 공개 전에는 자유롭게 바꾸실 수 있고, 입력하면 사용 가능한 주소인지 바로 알려드립니다.',sort_order:100,visible:true},
 {category:'공개·소장',question:'비공개했는데 카카오톡에는 사진이 계속 보여요.',answer:'카카오톡 등 메신저는 링크가 공유될 때 사진과 제목을 자체 서버에 잠시 저장(캐시)해 두는 특성이 있어요. 그래서 청첩장을 비공개해도 이미 공유된 채팅방의 미리보기는 일정 기간 남아 있을 수 있습니다. 새로 공유되는 링크부터는 보이지 않으니 안심하세요.',sort_order:110,visible:true},
 {category:'결제·환불',question:'가격이 어떻게 되나요?',answer:'모바일 청첩장 1건에 29,900원이에요. 이벤트 코드가 있으시면 결제 화면에 입력해 19,900원에, 세즈 종이 청첩장을 구매하신 고객은 주문번호를 입력해 9,900원에 이용하실 수 있어요. 쿠폰 코드를 받으셨다면 같은 입력창에 넣어 주세요.',sort_order:120,visible:true},
 {category:'결제·환불',question:'결제하면 바로 공개되나요?',answer:'결제하면 공개 권한이 열려요. 공개는 원하실 때 직접 하시면 됩니다 — 공개 설정에서 [바로 공개하기]를 누르면 그 순간부터 하객에게 보여요. 결제만 미리 해두고 나중에 공개해도 괜찮아요(단, 공개하려면 예식일이 입력되어 있어야 해요).',sort_order:130,visible:true},
 {category:'결제·환불',question:'환불 규정이 궁금해요.',answer:'결제 후 공개 전에는 전액 환불이 가능해요. 공개가 시작된 뒤에는 고유 주소 생성과 호스팅 서비스가 이미 제공된 상태라 환불이 어려운 점 양해 부탁드립니다. 문의는 네이버 톡톡 또는 thecezhouse@naver.com으로 주세요.',sort_order:140,visible:true}
];
window.cezGetFaqs=function(){ return (DB&&DB.faqs&&DB.faqs.length)?DB.faqs:window.CEZ_FAQ_DEFAULT; };
async function loadFaqs(){
  if(!window.SB||!SB.client)return;
  try{
    var r=await SB.client.from('faqs').select('*').order('sort_order',{ascending:true});
    if(r.error||!Array.isArray(r.data)||!r.data.length)return;
    DB.faqs=r.data;
    if(typeof window.cezFaqRefresh==='function')window.cezFaqRefresh();
  }catch(e){}
}
var _cezTplLoaded=false;
async function loadTemplates(){
  if(!window.SB || !SB.client) return;
  try{
    var r = await SB.client.from('templates').select('*').order('sort_order',{ascending:true});
    if(r.error || !Array.isArray(r.data) || !r.data.length) return;
    DB.templates = r.data.map(function(t){
      var o={id:t.id,name:(t.id==='luce'&&(!t.name||t.name==='Luce'))?'Lemon Archive':t.name,desc:t.descr||'',swatch:t.swatch||'',visible:t.visible!==false};
      if(t.custom_config && t.custom_config.bg) o.custom=t.custom_config;
      return o;
    }).filter(function(t){ return t.id==='luce'||t.id==='cotton'||t.id==='kakao'; }); /* v4.4: Lemon/Cotton/Kakao */
    var _def=defaultTemplates();
    _def.forEach(function(dt){ if(!DB.templates.some(function(t){return t.id===dt.id;})) DB.templates.push(dt); });
    if(!DB.templates.length) DB.templates=_def;
    if(location.hash==='#/admin' || location.hash.indexOf('#/editor')===0 || location.hash.indexOf('#/i/')===0) render();
  }catch(e){ console.error('[loadTemplates]', e); }
}
var _cezSettingsLoaded=false;
async function loadSiteSettings(){
  if(_cezSettingsLoaded||!window.SB||!SB.client)return;
  _cezSettingsLoaded=true;
  try{
    var r=await SB.client.from('site_settings').select('value').eq('key','defaults').maybeSingle();
    if(r&&r.data&&r.data.value){
      DB.defaults=Object.assign({},DB.defaults||defaultDefaults(),r.data.value);
      if(location.hash==='#/admin'||location.hash.indexOf('#/i/')===0) render();
    }
  }catch(e){ _cezSettingsLoaded=false; }
}
function ensureTemplatesLoaded(){ try{loadFaqs();}catch(e){} try{loadSiteSettings();}catch(e){} 
  if(_cezTplLoaded || !window.SB || !SB.client) return;
  _cezTplLoaded=true; loadTemplates();
}
var _cezLastHash=null;
/* ── 배포 신선도 자동 갱신 ───────────────────────────────────────────
   오래 열어둔 탭/인앱브라우저가 옛 인라인 JS(구 디자인)를 계속 쓰는 것을 방지한다.
   게스트 청첩장 뷰(#/i/)에서만, 서버 build id(version.txt)와 다르면 1회 자동 새로고침.
   ⚠ 에디터/관리자 화면에선 절대 리로드하지 않는다(작성 내용 유실 방지).
   ⚠ 무한루프 방지: 같은 버전으로는 세션당 1회만. 실패·미배포 환경에선 아무 동작도 안 한다. */
window.CEZ_BUILD='74519418b879';
function cezCheckFresh(){
  try{
    if((location.hash||'').indexOf('#/i/')!==0) return;              /* 게스트 뷰에서만 */
    if(window._cezFreshChecked) return; window._cezFreshChecked=true;
    var cur=(''+(window.CEZ_BUILD||'')).trim();
    if(!cur || cur.charAt(0)==='_') return;                          /* 미치환(로컬/개발) → 무시 */
    fetch('/version.txt?t='+(new Date().getTime()),{cache:'no-store'})
      .then(function(r){ return (r&&r.ok)?r.text():null; })
      .then(function(v){
        if(v==null) return; v=(''+v).trim(); if(!v) return;
        if(v===cur) return;                                          /* 이미 최신 코드 */
        var key='cez_fresh_'+v;
        try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key,'1'); }catch(e){}
        location.reload();                                           /* 최신 코드로 1회만 재로드 */
      })
      .catch(function(){});
  }catch(e){}
}
/* 편집기/관리자 화면: 서버 build id와 다르면 '새 버전·새로고침' 배너 표시(자동 리로드 X — 작성 유실 방지).
   버튼 클릭 시에만 리로드. 세션당 1회만. */
function cezCheckFreshEditor(){
  try{
    if(window._cezFreshEdChecked) return; window._cezFreshEdChecked=true;
    var cur=(''+(window.CEZ_BUILD||'')).trim();
    if(!cur || cur.charAt(0)==='_') return;
    fetch('/version.txt?t='+(new Date().getTime()),{cache:'no-store'})
      .then(function(r){ return (r&&r.ok)?r.text():null; })
      .then(function(v){
        if(v==null) return; v=(''+v).trim(); if(!v || v===cur) return;
        if(document.getElementById('cez-fresh-banner')) return;
        var b=document.createElement('div'); b.id='cez-fresh-banner';
        b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:2147483000;background:#141414;color:#fff;padding:10px 16px;border-radius:9999px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;font-family:sans-serif';
        b.innerHTML='<span>새 버전이 나왔어요</span><button type="button" id="cez-fresh-reload" style="border:0;background:#fff;color:#141414;border-radius:9999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer">새로고침</button>';
        document.body.appendChild(b);
        var btn=document.getElementById('cez-fresh-reload'); if(btn) btn.onclick=function(){ location.reload(true); };
      })
      .catch(function(){});
  }catch(e){}
}
function render(){
  const h=location.hash||'#/';
  ensureTemplatesLoaded();
  /* 같은 화면을 다시 그릴 때는 스크롤을 유지, 새 화면 진입 시에만 맨 위로.
     (클릭할 때마다 최상단으로 튀던 버그 방지) */
  var _sp=(h===_cezLastHash)?(window.scrollY||document.documentElement.scrollTop||0):0;
  _cezLastHash=h;
  var _sc=function(){ if(window._preserveScrollY==null)window.scrollTo(0,_sp); };
  if(h.indexOf('#/i/')===0){cezCheckFresh();app().innerHTML=viewPublished(decodeURIComponent(h.slice(4)));_sc();return;}
  if(h==='#/login'){app().innerHTML=viewLogin();_sc();return;}
  if(h==='#/admin'){if(!session||session.role!=='admin'){go('#/login');return;}app().innerHTML=viewAdmin();_sc();if(typeof window.cezReloadMembers==='function')setTimeout(function(){try{window.cezReloadMembers();}catch(e){console.error('[admin auto-load]',e);}},60);return;}
  /* v4.3 #1: 에디터는 하나 — #/editor(=v4). 기존 폼 에디터는 #/editor-legacy 로만 접근(안전망). */
  if(h.indexOf('#/editor-legacy')===0){go('#/editor');return;} /* v4.5: 레거시 폼 에디터 봉인 — 구식 정책·데모 결제 모달과의 충돌 차단 */
  if(h.indexOf('#/v4')===0||h.indexOf('#/editor')===0){
    if(!session){go('#/login');return;}
    const p=h.split('/');if(p[2]&&session.role==='admin')editId=p[2];
    if(typeof renderEditorV4==='function'){renderEditorV4();cezCheckFreshEditor();try{var _lu=editTarget();if(_lu&&_lu.slug)cezLoadRSVPs(_lu.slug);}catch(e){}_sc();return;}
    app().innerHTML=viewEditor();_sc();requestAnimationFrame(setupScrollSync);return;
  }
  if(!session){app().innerHTML=viewLogin();_sc();return;}
  if(typeof renderEditorV4==='function'){renderEditorV4();try{var _lu=editTarget();if(_lu&&_lu.slug)cezLoadRSVPs(_lu.slug);}catch(e){}_sc();return;}
  app().innerHTML=viewEditor();_sc();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeCezModal&&closeCezModal();closeFigmaModal&&closeFigmaModal();}});
window._edTouched=window._edTouched||{};document.addEventListener('click',function(e){var t=e.target;if(!t)return;var h2=(t.tagName==='H2')?t:(t.closest&&t.closest('h2'));if(h2&&!h2.classList.contains('h2-plain')&&h2.parentElement&&h2.parentElement.classList&&h2.parentElement.classList.contains('ed-section')){var sec=h2.parentElement.dataset.sec;if(sec){window._edTouched[sec]=true;}h2.parentElement.classList.toggle('collapsed');}});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',render);
render();

<script id="cez-sb-hooks">
(function(){
  function poll(name, fn){
    var t = setInterval(function(){ if(typeof window[name]==='function'){ clearInterval(t); fn(); } }, 200);
  }
  poll('saveEditor', function(){
    var orig = window.saveEditor;
    window.saveEditor = function(){
      orig.apply(this, arguments);
      try {
        var _TR=function(){try{if(window.CEZ_DEBUG||(location.host||'').indexOf('staging')>=0)console.log.apply(console,['[CEZ-TRACE]'].concat([].slice.call(arguments)));}catch(_){}};
        if(!window.SB || !SB.user) return;
        var u = (typeof editTarget==='function') ? editTarget() : null;
        if(!u || !u.slug) return;
        _TR('SB.saveInvitation → slug=',u.slug,'sections=',((u.data&&u.data.sections)||[]).map(function(s){return s.id;}).join(','));
        SB.saveInvitation({
          slug: u.slug, data: u.data, template: u.data.template||'minimal',
          published: !!u.published,   /* 저장=발행 분리: 배포 버튼으로만 공개 (신규는 비공개 시작) */
          publish_start: u.data.publishStart||null,
          publish_end:   u.data.publishEnd||null
        }).then(function(saved){
          _TR('SB.saveInvitation OK id=',saved&&saved.id);
          u._supabaseRowId = saved.id;
          u.slugLocked = saved.slug_locked;
          if(typeof toast==='function'){
            if(!SB.canPublish()){
              /* silent · Phase A */
            } else {
              /* silent · Phase A */
            }
          }
        }).catch(function(e){
          console.error('[SB save]',e);
          _TR('SB.saveInvitation FAILED →', e && (e.message||e));
          if(typeof window.V4saveError==='function'){ try{ window.V4saveError(e); }catch(_){}}
          if(e&&/locked:/i.test(e.message||'')&&typeof toast==='function'){ toast('저장이 서버에서 거부됐어요: '+e.message); }
        });
      } catch(e){ console.error(e); }
    };
  });
  /* viewPublished — slug 조회 시 Supabase 우선.
     v4.3 #9: SB(esm.sh CDN) 초기화 전에 렌더되면 이전엔 로컬 데모로 폴백해
     모바일(첫 방문·느린 네트워크)에서 'NOT FOUND'가 고착됐다. 이제 SB가 준비될
     때까지 로딩 화면을 반환하고, 준비되는 대로 서버 조회로 그린다. */
  poll('viewPublished', function(){
    var orig = window.viewPublished;
    function guestShell(inner){ return '<div class="pub-wrap"><div class="pub-paper">'+inner+'</div></div>'; }
    function drawServer(slug){
      SB.getInvitationBySlug(slug).then(function(inv){
        var el = document.getElementById('app'); if(!el) return;
        if((location.hash||'').indexOf('#/i/')!==0) return; /* 라우트 이탈 시 무시 */
        if(!inv){ el.innerHTML = guestShell('<div class="gate-block"><div class="display">NOT FOUND</div><p>존재하지 않는 청첩장 주소입니다.<br>주소를 다시 확인해 주세요.</p></div>'); return; }
        /* 방어: data.template 이 비어 있으면 template 컬럼(권위값)으로 채운다 —
           빈 값이 구 headerBlock(레거시 세리프) 디자인으로 폴백되는 것을 원천 차단 */
        try{ if(inv.data && !inv.data.template && inv.template){ inv.data.template=inv.template; } }catch(e){}
        /* v4.3: 관리자는 공개 종료/전이어도 두 버전(공개 중·공개 후) 모두 열람 가능 */
        var _adm=(typeof session!=='undefined' && session && session.role==='admin')||(window.SB&&SB.isAdmin&&SB.isAdmin());
        /* 직접 URL로 연 직후엔 관리자 프로필이 아직 로드 전일 수 있다 → 잠시 후 재판정 (미공개 청첩장도 어드민은 볼 수 있어야 함) */
        if(!_adm && !inv.is_currently_public && window.SB && SB._token && SB._token()){
          /* 관리자 프로필 로드 대기용 재시도 — 4회(≈2.4s)면 충분. 과거 25회는 draft 뷰마다 RPC를 최대 25번 낭비(Disk IO). */
          window._cezAdmRetry=window._cezAdmRetry||0;
          if(window._cezAdmRetry<4){ window._cezAdmRetry++; setTimeout(function(){ if((location.hash||'').indexOf('#/i/')===0) drawServer(slug); },600); }
        }
        if(_adm){ window._cezAdmRetry=99; }
        if(_adm && inv.is_currently_public && window._guestPvMode!=='post'){ _adm=false; } /* 공개 중이면 하객과 동일하게 — 미리보기 바 불필요 */
        if(_adm){
          /* 예식 전/후 전환은 서버 재조회 없이 캐시된 inv로 즉시 재렌더
             (재조회하던 시절엔 supabase-js 세션 락으로 두 번째 호출이 안 끝나 버튼이 '안 눌리는' 증상) */
          var _renderAdm=function(){
            var post=(window._guestPvMode==='post');
            var body=post&&typeof renderThankYouPreview==='function'?renderThankYouPreview(inv.data):renderInvitation(inv.data);
            var tg=function(m,label,on){return '<button onclick="_cezGuestMode(\''+m+'\')" style="margin-left:6px;border:1px solid rgba(255,255,255,.4);background:'+(on?'#fff':'transparent')+';color:'+(on?'#1d1e1a':'#fbfaf7')+';border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer">'+label+'</button>';};
            var bar='<div style="position:fixed;top:0;left:0;right:0;z-index:40;background:#1d1e1a;color:#fbfaf7;text-align:center;padding:8px 14px;font-size:12.5px">미리보기 · 방문자에게는 '+(inv.is_currently_public?'공개':'비공개')+' 상태'+tg('live','예식 전',!post)+tg('post','예식 후',post)+'</div>';
            el.innerHTML = bar+'<div style="height:38px"></div>'+guestShell(body)+(typeof musicPlayerHTML==='function'?musicPlayerHTML(inv.data):'');
          };
          window._cezGuestMode=function(m){ window._guestPvMode=m; _renderAdm(); };
          _renderAdm();
          return;
        }
        /* 보관 정책: 예식+6개월(관리자 전용) → NOT FOUND / 예식+3개월(보관) → 본인만 열람 */
        var _arch=(typeof cezArchState==='function')?cezArchState(inv.data,inv.is_currently_public):{state:'PUBLISHED'};
        if(_arch.state==='ADMIN_ARCHIVE'){
          el.innerHTML = guestShell('<div class="gate-block"><div class="display">NOT FOUND</div><p>존재하지 않는 청첩장입니다.</p></div>');
          return;
        }
        if(_arch.state==='ARCHIVE'){
          var _own=!!(window.SB&&SB.user&&inv.user_id&&SB.user.id===inv.user_id);
          if(_own){
            var obar='<div style="position:fixed;top:0;left:0;right:0;z-index:40;background:#1d1e1a;color:#fbfaf7;text-align:center;padding:8px 14px;font-size:12.5px">보관중 · 하객에게는 감사 인사 화면이 보여요</div>';
            el.innerHTML = obar+'<div style="height:38px"></div>'+guestShell(renderInvitation(inv.data))+(typeof musicPlayerHTML==='function'?musicPlayerHTML(inv.data):'');
            return;
          }
          /* v4.5: 하객에게는 에디터 '공개 후' 미리보기와 동일한 감사 인사 화면 */
          el.innerHTML = guestShell(typeof renderThankYouPreview==='function'?renderThankYouPreview(inv.data):'<div class="gate-block"><div class="display">THANK YOU</div></div>');
          return;
        }
        if(!inv.is_currently_public){
          if(inv.block_reason==='EXPIRED'){
            el.innerHTML = guestShell(typeof renderThankYouPreview==='function'?renderThankYouPreview(inv.data):'<div class="gate-block"><div class="display">THANK YOU</div></div>');
            return;
          }
          if(inv.block_reason==='NOT_PUBLISHED'){
            el.innerHTML = guestShell('<div class="gate-block"><div class="display">청첩장 준비 중</div><p>청첩장을 준비하고 있어요.<br>잠시 후 다시 방문해 주세요.</p></div>');
            return;
          }
          var msg = ({PAYMENT_PENDING:'결제 확인 중입니다',PAYMENT_CANCELLED:'주문이 취소되었습니다',PAYMENT_REFUNDED:'환불 처리되었습니다',PAYMENT_FAILED:'결제에 실패했습니다',NO_PERMISSION:'관리자 승인 대기 중입니다',NOT_YET:'아직 공개 시작 전입니다'})[inv.block_reason] || '비공개 상태입니다';
          el.innerHTML = guestShell('<div class="gate-block"><div class="display">비공개 상태입니다</div><p>'+msg+'</p></div>');
          return;
        }
        var vk='view_'+slug, isFirst=!localStorage.getItem(vk);
        if(isFirst) localStorage.setItem(vk,'1');
        SB.bumpView(inv.id, isFirst);
        if(typeof renderInvitation==='function'){
          /* #8: 하객 실제 배포 화면과 동일한 래퍼(.pub-paper 480px) + 음악 플레이어 */
          el.innerHTML = guestShell(renderInvitation(inv.data)) + (typeof musicPlayerHTML==='function'?musicPlayerHTML(inv.data):'');
        } else {
          orig.apply(null, [slug]);
        }
      }).catch(function(e){
        console.error('[guest load]', e);
        var el=document.getElementById('app');
        if(el) el.innerHTML = guestShell('<div class="gate-block"><div class="display">잠시 후 다시 시도해 주세요</div><p>청첩장을 불러오지 못했습니다.</p></div>');
      });
    }
    window.viewPublished = function(slug){
      var local = ((typeof DB !== 'undefined' && DB && DB.users) || []).find(function(x){ return x.slug===slug && x.role!=='admin'; });
      if(local && (typeof session !== 'undefined' && session && session.id===local.id) && window.SB && SB.client) return orig.apply(this, [slug]);
      if(window.SB && SB.client){ drawServer(slug); }
      else {
        var tries=0;
        var t=setInterval(function(){
          tries++;
          if(window.SB && SB.client){ clearInterval(t); drawServer(slug); }
          else if(tries>100){ clearInterval(t); var el=document.getElementById('app'); if(el) el.innerHTML=guestShell('<div class="gate-block"><div class="display">연결이 원활하지 않아요</div><p>네트워크 상태를 확인하고 새로고침해 주세요.</p></div>'); }
        },150);
      }
      return guestShell('<div class="gate-block" style="opacity:.65"><div class="display" style="font-size:20px">청첩장을 불러오는 중…</div></div>');
    };
    /* 오버라이드 설치 전에 원본이 이미 그렸을 수 있으니, 하객 라우트면 한 번 다시 그린다 */
    if((location.hash||'').indexOf('#/i/')===0 && typeof render==='function'){ try{ render(); }catch(e){} }
  });
})();
</script>
<script id="cez-admin-fns">
window.cezAdminMembersPanel = function(){
  if(!window.SB || !window.SB.user) return '<div style="margin-top:54px;padding:24px 28px;background:var(--ds-cta-secondary);border-radius:var(--r-card);text-align:center"><div style="font-size:13px;color:var(--ds-text-2);line-height:1.6">☁️ 회원 관리 패널은 네이버 로그인 후 첫 어드민 부트스트랩 시 표시됩니다.<br>콘솔에서 한 번: <code style="background:#fff;padding:1px 5px;border-radius:4px">await SB.bootstrapFirstAdmin(&quot;본인이메일@naver.com&quot;)</code></div></div>';
  return '<h2 class="section-h" style="margin-top:54px">☁️ 회원 관리 (Supabase)</h2>'
    + '<p class="sec-sub">네이버 로그인 회원과 스마트스토어 결제 이력을 관리합니다. 결제 확인(자동)과 공개 권한(수동)이 분리됩니다.</p>'
    + '<div class="rsvp-stats" id="cez-mem-stats"><div class="rsvp-stat"><div class="k">전체</div><div class="v" id="ms-t">…</div></div><div class="rsvp-stat"><div class="k">결제 완료(PAID)</div><div class="v ok" id="ms-paid">…</div></div><div class="rsvp-stat"><div class="k">권한 부여</div><div class="v ok" id="ms-perm">…</div></div><div class="rsvp-stat"><div class="k">공개 활성</div><div class="v ok" id="ms-pub">…</div></div></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px"><button type="button" class="btn-primary" style="padding:10px 18px;font-size:13px;font-weight:600" onclick="cezSyncSmartstore()">🔄 결제 동기화</button><button type="button" class="btn btn-secondary btn-sm" onclick="cezReloadMembers()">새로고침</button><button type="button" class="btn btn-secondary btn-sm" onclick="cezAddManualOrder()">+ 수동 결제 입력</button></div>'
    + '<div class="tablecard" style="overflow-x:auto"><table style="min-width:880px"><thead><tr><th>이름</th><th>네이버 ID</th><th>가입일</th><th>결제</th><th>권한</th><th>비고</th><th>액션</th></tr></thead><tbody id="cez-mem-tbody"><tr><td colspan="7" style="text-align:center;padding:30px;color:var(--ds-text-muted)">불러오는 중…</td></tr></tbody></table></div>'
    + '<script>setTimeout(cezReloadMembers,200);<\/script>';
};

window.cezSyncSmartstore = async function(){
  /* 결제 자동 동기화(/api/sync-smartstore-orders)는 아직 미구현.
     누르면 405 대신 준비 중 안내만. 실제 구현 시 아래 주석 로직 복원. */
  toast('결제 자동 동기화는 준비 중입니다 · 곧 지원 예정이에요');
  return;
  /* eslint-disable no-unreachable */
  if(!SB || !SB.isAdmin()){ toast('어드민 권한이 필요합니다'); return; }
  toast('네이버 커머스 API에서 주문을 동기화하는 중...');
  try { var r = await SB.syncSmartstoreOrders(); toast('동기화 완료 · 신규 '+(r.created||0)+' / 갱신 '+(r.updated||0)+' 건'); }
  catch(e){ toast('동기화 실패: '+e.message); }
  cezReloadMembers();
};

window.cezReloadMembers = async function(){
  if(!SB||!SB.user) return;
  if(!SB.isAdmin()){
    var tb=document.getElementById('cez-mem-tbody');
    if(tb) tb.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--ds-danger)">어드민 권한이 없습니다. 콘솔에서 <code>await SB.bootstrapFirstAdmin("'+(SB.user.email||'이메일')+'")</code> 실행 후 새로고침.</td></tr>';
    return;
  }
  var members = await SB.listMembers();
  var t=members.length;
  var paid=members.filter(function(m){return m.payment_status==='PAID';}).length;
  var perm=members.filter(function(m){return m.publish_permission===true;}).length;
  var pub =members.filter(function(m){return m.is_publicly_visible===true;}).length;
  var setT=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v;};
  setT('ms-t',t); setT('ms-paid',paid); setT('ms-perm',perm); setT('ms-pub',pub);
  var LBL={PENDING:'결제 대기',PAID:'결제 완료',CANCELLED:'주문 취소',REFUNDED:'환불',FAILED:'결제 실패'};
  var CLS={PENDING:'unpaid',PAID:'paid',CANCELLED:'unpaid',REFUNDED:'unpaid',FAILED:'unpaid'};
  var rows = members.map(function(m){
    var cd = m.created_at ? new Date(m.created_at) : null;
    var dateStr = cd ? (cd.getFullYear()+'-'+pad(cd.getMonth()+1)+'-'+pad(cd.getDate())) : '-';
    var nameCell = '<div class="u-name">'+esc(m.nickname||'')+'</div><div class="u-mail">'+esc(m.email||'')+'</div>' + (m.slug ? '<div style="font-size:11px;color:var(--ds-text-muted);margin-top:3px">/i/<code>'+esc(m.slug)+'</code></div>':'');
    var naver = m.naver_user_id ? '<code style="font-size:11.5px;background:var(--ds-cta-secondary);padding:2px 6px;border-radius:4px">'+esc(m.naver_user_id)+'</code>' : '<span style="color:var(--ds-text-muted)">-</span>';
    var payBadge = '<span class="badge '+(CLS[m.payment_status]||'unpaid')+'">'+(LBL[m.payment_status]||m.payment_status||'-')+'</span>' + (m.payment_synced_at ? '<div style="font-size:10.5px;color:var(--ds-text-muted);margin-top:3px">동기화 '+new Date(m.payment_synced_at).toLocaleString('ko-KR')+'</div>':'');
    var permBadge = m.publish_permission ? '<span class="badge paid">권한 부여</span>'+(m.publish_permission_at?'<div style="font-size:10.5px;color:var(--ds-text-muted);margin-top:3px">'+new Date(m.publish_permission_at).toLocaleDateString('ko-KR')+'</div>':'') : '<span class="badge unpaid">권한 중지</span>';
    var noteHtml = '<textarea data-uid="'+m.id+'" onblur="cezSaveNote(this)" placeholder="비고 입력..." style="width:140px;height:46px;padding:6px 8px;border:1px solid var(--ds-stroke);border-radius:6px;font-size:11.5px;resize:vertical;font-family:inherit;background:#fff">'+esc(m.admin_note||'')+'</textarea>';
    var actBtns = '<div style="display:flex;flex-direction:column;gap:5px;align-items:stretch">' + (m.publish_permission ? '<button type="button" class="btn btn-secondary btn-sm" style="padding:5px 8px;font-size:11px" onclick="cezTogglePerm(\''+m.id+'\',false)">권한 중지</button>' : '<button type="button" class="btn-primary" style="padding:6px 8px;font-size:11px;font-weight:600" onclick="cezTogglePerm(\''+m.id+'\',true)">권한 부여</button>') + '<button type="button" class="btn btn-secondary btn-sm" style="padding:4px 8px;font-size:10.5px" onclick="cezViewOrders(\''+m.id+'\',\''+esc(m.nickname||m.email||'')+'\')">주문 보기</button></div>';
    return '<tr><td>'+nameCell+'</td><td>'+naver+'</td><td style="font-size:11.5px;color:var(--ds-text-muted)">'+dateStr+'</td><td>'+payBadge+'</td><td>'+permBadge+'</td><td>'+noteHtml+'</td><td>'+actBtns+'</td></tr>';
  }).join('');
  document.getElementById('cez-mem-tbody').innerHTML = rows || '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--ds-text-muted)">아직 회원이 없습니다.</td></tr>';
};

window.cezTogglePerm = async function(uid, allow){
  var msg = allow ? '공개 권한을 부여하시겠습니까?\n→ 결제 완료 상태이면 즉시 공개됩니다.' : '공개 권한을 중지하시겠습니까?\n→ 공개 URL이 즉시 비공개로 전환됩니다.';
  if(!confirm(msg)) return;
  var r = await SB.grantPublishPermission(uid, allow);
  if(r.error){ toast('실패: '+r.error.message); return; }
  toast(allow ? '권한이 부여되었습니다 ✓' : '권한이 중지되었습니다');
  cezReloadMembers();
};

window.cezSaveNote = async function(el){
  var uid = el.getAttribute('data-uid'); var note = el.value;
  var r = await SB.setAdminNote(uid, note);
  if(r.error){ toast('비고 저장 실패: '+r.error.message); return; }
  el.style.borderColor = 'var(--ds-ok)'; setTimeout(function(){ el.style.borderColor='var(--ds-stroke)'; }, 800);
};

window.cezAddManualOrder = async function(){
  var orderId = prompt('스마트스토어 주문번호:'); if(!orderId) return;
  var email = prompt('결제자 이메일 (회원 매칭용, 비우면 미매칭):') || '';
  var amount = parseInt(prompt('결제 금액:') || '0', 10) || 0;
  var uid = null;
  if(email){
    var members = await SB.listMembers();
    var m = members.find(function(x){return x.email===email;});
    if(m) uid = m.id;
    else if(!confirm('일치하는 회원이 없습니다. 그래도 기록하시겠습니까?')) return;
  }
  var r = await SB.upsertSmartstoreOrder({ order_id:orderId, user_id:uid, product_name:'수동 입력 결제', amount:amount, status:'PAID', paid_at:new Date().toISOString(), raw:{source:'manual'} });
  if(r.error){ toast('실패: '+r.error.message); return; }
  toast('주문이 기록되었습니다' + (uid?' · payment_status 자동 갱신':''));
  cezReloadMembers();
};

window.cezViewOrders = async function(uid, name){
  var orders = await SB.listOrders(uid);
  if(!orders.length){ alert('이 회원의 주문 이력이 없습니다.'); return; }
  var html = orders.map(function(o){
    return '['+o.status+'] '+o.smartstore_order_id+'\n  상품: '+(o.product_name||'-')+'\n  금액: '+(o.amount||0).toLocaleString()+'원\n  결제일: '+(o.paid_at||'-')+'\n  채널: '+o.channel+'\n';
  }).join('\n');
  alert(name + ' 의 주문 이력 ('+orders.length+'건)\n\n'+html);
};
