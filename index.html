function pickMeal(el,v){var p=el.parentNode;p.querySelectorAll('label').forEach(function(l){l.classList.remove('sel','no');});el.classList.add('sel');if(v==='식사안함')el.classList.add('no');el.querySelector('input').checked=true;}
/* ── RSVP 저장 신뢰성 (응답 누락 방지) ────────────────────────────────
   과거: 저장 성공 여부와 무관하게 하객에게 '감사'를 즉시 표시 → 저장이 실패해도(느린 네트워크·slug 미해석·RPC 오류)
         하객은 모르고 다시 안 보내 → 응답이 조용히 유실.
   개선: (1) 저장 성공을 '확인한 뒤에만' 완료 표시, (2) 3회 재시도, (3) 실패 시 재접속 때 자동 재전송(localStorage). */
var CEZ_RSVP_PEND='cez_pending_rsvp';
async function saveRSVPReliable(slug, payload){
  /* 로컬 클론: 외부 서버 없이 브라우저 localStorage에 응답 기록 */
  try{
    var key='cez_rsvp_'+slug;
    var arr=[]; try{ arr=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){}
    arr.push(Object.assign({ts:Date.now()},payload));
    localStorage.setItem(key, JSON.stringify(arr.slice(-300)));
    return true;
  }catch(e){ console.error('[RSVP save]', e && e.message); return false; }
}
function cezPendGet(){ try{ return JSON.parse(localStorage.getItem(CEZ_RSVP_PEND)||'[]'); }catch(e){ return []; } }
function cezPendSet(a){ try{ localStorage.setItem(CEZ_RSVP_PEND, JSON.stringify(a.slice(-20))); }catch(e){} }
function cezStashPendingRSVP(slug, payload, key){ var a=cezPendGet(); a.push({slug:slug,payload:payload,key:key,ts:Date.now()}); cezPendSet(a); }
function cezClearPending(key){ if(!key)return; cezPendSet(cezPendGet().filter(function(x){return x.key!==key;})); }
async function cezFlushPendingRSVP(){
  try{
    var a=cezPendGet(); if(!a.length) return;
    var keep=[];
    for(var i=0;i<a.length;i++){ var ok=await saveRSVPReliable(a[i].slug, a[i].payload); if(!ok) keep.push(a[i]); }
    cezPendSet(keep);
  }catch(e){}
}
try{ setTimeout(cezFlushPendingRSVP, 6000); }catch(e){}   /* 접속 시 지난 실패분 자동 재전송 */

function submitRSVPv2(slug){
  /* 슬러그: 해시형(#/i/slug)·경로형(/i/slug) 모두 URL 을 신뢰 (렌더 slug 오해석으로 저장 스킵되던 문제 방지) */
  try{
    var _h=location.hash||'';
    if(_h.indexOf('#/i/')===0){ var _us=decodeURIComponent(_h.slice(4)).trim(); if(_us) slug=_us; }
    else { var _pm=(location.pathname||'').match(/^\/i\/([^\/?#]+)/); if(_pm && _pm[1]){ var _ps=decodeURIComponent(_pm[1]).trim(); if(_ps) slug=_ps; } }
  }catch(e){}
  var n=document.getElementById('rs-name');
  if(!n||!n.value.trim()){toast('성함을 입력해 주세요');return;}
  var rec={name:n.value.trim(),ts:Date.now()};
  var sd=document.querySelector('input[name=rs-side]:checked');if(sd)rec.side=sd.value;
  var c=document.getElementById('rs-count');if(c)rec.count=c.value;
  var a=document.querySelector('input[name=rs-att]:checked');if(a)rec.attend=a.value;
  var m=document.querySelector('input[name=rs-meal]:checked');if(m)rec.meal=m.value;
  var al=document.getElementById('rs-allergy');if(al)rec.allergy=al.value.trim();
  var sh=document.querySelector('input[name=rs-sh]:checked');if(sh)rec.shuttle=sh.value;
  var pk=document.querySelector('input[name=rs-pk]:checked');if(pk)rec.parking=pk.value;
  var msg=document.getElementById('rs-msg');if(msg)rec.message=msg.value.trim();

  var extras=[];
  if(rec.allergy) extras.push('알레르기: '+rec.allergy);
  if(rec.shuttle) extras.push('셔틀버스: '+rec.shuttle);
  if(rec.parking) extras.push('주차: '+rec.parking);
  var fullMsg=(rec.message||'')+(extras.length?((rec.message?'\n':'')+extras.join(' · ')):'');
  var payload={name:rec.name, side:rec.side||null, attend:rec.attend||null, count:rec.count||null, meal:rec.meal||null, message:fullMsg||null};
  var pkey=slug+'|'+rec.name+'|'+rec.ts;

  function showDone(){
    DB.rsvps=DB.rsvps||{};DB.rsvps[slug]=DB.rsvps[slug]||[];
    DB.rsvps[slug].push(rec);DB.rsvps[slug]._submitted=true;
    var card=document.querySelector('.rsvp-card');
    if(card&&card.parentNode){card.outerHTML='<div class="rsvp-card rsvp-done" style="color:inherit">참석 의사를 보내주셔서 감사합니다 💌</div>';}
    toast('참석 의사를 보내주셔서 감사합니다');
  }

  /* 프리뷰/에디터(실제 저장 대상 아님) — 기존처럼 즉시 완료 */
  var canSave = !!(slug && slug!=='_preview');
  if(!canSave){ showDone(); return; }

  /* 실제 하객 — 저장 성공을 확인한 뒤에만 완료 표시 */
  var btn=document.querySelector('.rs2-submit'); var oldTxt=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='보내는 중…'; }
  saveRSVPReliable(slug, payload).then(function(ok){
    if(ok){ cezClearPending(pkey); showDone(); }
    else {
      cezStashPendingRSVP(slug, payload, pkey);           /* 재접속 시 자동 재전송 */
      if(btn){ btn.disabled=false; btn.textContent=oldTxt||'제출하기'; }
      toast('저장이 지연되고 있어요. 잠시 후 한 번만 더 눌러 주세요 🙏');
    }
  });
}

/* music player (renders fixed-position button + audio element) */
function musicPlayerHTML(d){
  if(!d||!d.music||!d.music.enabled)return '';
  var src='';
  if(d.music.kind==='preset'&&d.music.presetIdx>=0){
    var pres=(DB.defaults&&DB.defaults.musicPresets)||[];
    if(pres[d.music.presetIdx])src=pres[d.music.presetIdx].url||'';
  }else if(d.music.kind==='url'||d.music.kind==='upload'){
    src=d.music.url||'';
  }
  if(!src)return ''; /* 음원 미설정 시 죽은 회색 버튼 대신 아예 미표시 */
  var loopAttr=(d.music.loop!==false)?'loop':'';
  return '<audio id="inv-audio" src="'+esc(src)+'" '+loopAttr+' preload="auto"></audio>'
    +'<button class="inv-music" id="inv-music-btn" onclick="toggleMusic()" title="음악 재생/일시정지">'
    +'<svg id="music-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
    +'<svg id="music-icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
    +'</button>';
}
function toggleMusic(){
  var a=document.getElementById('inv-audio');if(!a)return;
  var pi=document.getElementById('music-icon-play'),pa=document.getElementById('music-icon-pause');
  if(a.paused){a.play().then(function(){if(pi)pi.style.display='none';if(pa)pa.style.display='block';}).catch(function(){toast('재생을 시작할 수 없어요. 화면을 한 번 터치해 주세요.');});}
  else{a.pause();if(pi)pi.style.display='block';if(pa)pa.style.display='none';}
}
/* 자동재생: 진입 시 바로 시도, 브라우저가 막으면 첫 터치/스크롤에서 시작 (사용자가 일시정지하면 다시 켜지 않음) */
function _musicSyncIcon(){var a=document.getElementById('inv-audio');var pi=document.getElementById('music-icon-play'),pa=document.getElementById('music-icon-pause');if(!a)return;var playing=!a.paused;if(pi)pi.style.display=playing?'none':'block';if(pa)pa.style.display=playing?'block':'none';}
(function(){
  var tried=false;
  function tryAuto(){
    var a=document.getElementById('inv-audio');
    if(!a||!a.paused||a._userPaused)return !!a&&!a.paused;
    return a.play().then(function(){_musicSyncIcon();return true;}).catch(function(){return false;});
  }
  function onGesture(){ Promise.resolve(tryAuto()).then(function(okv){ if(okv){ ['click','touchstart','scroll','keydown'].forEach(function(ev){ document.removeEventListener(ev,onGesture,true); }); } }); }
  new MutationObserver(function(){
    var a=document.getElementById('inv-audio');
    if(a&&!a._autoInit){
      a._autoInit=true; tried=false; window._cezInvAudio=a; /* 이탈 시 정지용 참조(엘리먼트가 DOM에서 제거돼도 접근) */
      /* toggleMusic의 일시정지만 사용자 의도로 기록 */
      var origToggle=window.toggleMusic;
      window.toggleMusic=function(){ var el=document.getElementById('inv-audio'); if(el&&!el.paused){ el._userPaused=true; } else if(el){ el._userPaused=false; } origToggle(); };
      Promise.resolve(tryAuto()).then(function(okv){
        if(!okv){ ['click','touchstart','scroll','keydown'].forEach(function(ev){ document.addEventListener(ev,onGesture,true); }); }
      });
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
/* 배경음악: 탭 전환·이탈·라우트 이동 시 정지 (하객이 나가도 계속 재생되던 문제) */
(function(){
  function invAudio(){ return document.getElementById('inv-audio')||window._cezInvAudio||null; }
  function pauseInv(remember){ var a=invAudio(); if(a&&!a.paused){ if(remember)a._pausedByHide=true; try{a.pause();}catch(e){} if(typeof _musicSyncIcon==='function')_musicSyncIcon(); } }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ pauseInv(true); }
    else { var a=invAudio(); if(a&&a._pausedByHide&&!a._userPaused){ a._pausedByHide=false; a.play().then(function(){ if(typeof _musicSyncIcon==='function')_musicSyncIcon(); }).catch(function(){}); } }
  });
  window.addEventListener('pagehide',pauseInv.bind(null,false));
  window.addEventListener('hashchange',function(){ if((location.hash||'').indexOf('#/i/')!==0){ pauseInv(false); } }); /* 청첩장 뷰를 벗어나면 정지 */
})();

/* Calendar save (Google Calendar + ICS) */
function trackView(slug){
  if(!slug||slug==='_preview')return;
  DB.stats=DB.stats||{};
  var s=DB.stats[slug]=DB.stats[slug]||{views:0,uniques:0,shares:{kakao:0,link:0,sms:0,insta:0},lastView:null};
  s.views++;
  try{
    var key='cez_seen_'+slug;
    if(!localStorage.getItem(key)){s.uniques++;localStorage.setItem(key,'1');}
  }catch(e){}
  s.lastView=Date.now();
}
function trackShare(slug,channel){
  if(!slug)return;
  DB.stats=DB.stats||{};
  var s=DB.stats[slug]=DB.stats[slug]||{views:0,uniques:0,shares:{kakao:0,link:0,sms:0,insta:0},lastView:null};
  s.shares=s.shares||{kakao:0,link:0,sms:0,insta:0};
  s.shares[channel]=(s.shares[channel]||0)+1;
}

function viewPublished(slug){
  const u=DB.users.find(x=>x.slug===slug&&x.role!=='admin');
  trackView(slug);
  if(!u||!u.data)return '';
  return '<div class="pub-wrap"><div class="pub-paper">'+renderInvitation(u.data)+'</div></div>'+musicPlayerHTML(u.data);
}
function render(){
  app().innerHTML=viewPublished('sample01');
  if(window._preserveScrollY==null)window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeCezModal&&closeCezModal();closeFigmaModal&&closeFigmaModal();}});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',render);
render();
